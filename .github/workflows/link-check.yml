name: Check links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check internal and external links
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir "${{ github.workspace }}"
            --verbose
            --no-progress
            --host-concurrency 2
            --max-retries 3
            --timeout 20
            --accept 200,201,204,206,301,302,303,307,308,401,403
            --exclude "instagram.com"
            './**/*.html'
          jobSummary: true
